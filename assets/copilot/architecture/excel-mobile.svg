<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2390" viewBox="0 0 520 2390" role="img" aria-labelledby="title desc"><title id="title">売上の変化を、次に確かめる論点へ。</title><desc id="desc">整えた表をもとに傾向を整理し、数値と解釈を人が検証する。。表を整える：売上データ。傾向を整理する：Copilot in Excel。数値を検証する：元データと照合。判断の材料にする：分析メモ・確認事項</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="520" height="2390" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Excel</text><text x="32" y="121" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">売上の変化を、</text><text x="32" y="161" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">次に確かめる論点へ。</text><rect x="32" y="210" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">01</text><text x="100" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">表を整える</text><path d="M52 262L468 262" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="298" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">売上データ</text><text x="52" y="338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">列の例</text><text x="52" y="372" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">年月・部門・商品・売上</text><text x="52" y="432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">対象を指定</text><text x="52" y="466" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">期間・単位・比較する範囲</text><text x="52" y="526" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">データを確認</text><text x="52" y="560" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">欠損・重複・合計行の扱い</text><path d="M260 616L260 638" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="646" width="456" height="400" rx="6" fill="#f0f7fd" stroke="#c8d8e6"/><text x="52" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">02</text><text x="100" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">傾向を整理する</text><path d="M52 698L468 698" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="734" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">Copilot in Excel</text><text x="52" y="774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">比較軸を指定</text><text x="52" y="808" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">月別・部門別・商品別</text><text x="52" y="868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差分を確認</text><text x="52" y="902" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">増減の大きい項目を抽出</text><text x="52" y="962" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">論点を分ける</text><text x="52" y="996" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">確認できた事実と仮説</text><path d="M260 1052L260 1074" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1082" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">03</text><text x="100" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">数値を検証する</text><path d="M52 1134L468 1134" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1170" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">元データと照合</text><text x="52" y="1210" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">集計を確認</text><text x="52" y="1244" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">計算式・分母・対象期間</text><text x="52" y="1304" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">解釈を確認</text><text x="52" y="1338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">相関と原因を区別する</text><text x="52" y="1398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">不足を洗い出す</text><text x="52" y="1432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">追加で必要なデータを整理</text><path d="M260 1488L260 1510" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1518" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">04</text><text x="100" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">判断の材料にする</text><path d="M52 1570L468 1570" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1606" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">分析メモ・確認事項</text><text x="52" y="1646" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">傾向の要約</text><text x="52" y="1680" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">どの部門・商品が変化したか</text><text x="52" y="1740" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">大きな変化</text><text x="52" y="1774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">増減を確認した対象項目</text><text x="52" y="1834" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">次に調べること</text><text x="52" y="1868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">要因を確かめる追加の分析</text><rect x="32" y="1970" width="456" height="350" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="52" y="2010" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="52" y="2059" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">更新の手順</text><text x="52" y="2094" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">データ更新時に分析範囲を確認</text><text x="52" y="2142" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">品質の確認</text><text x="52" y="2177" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">重要な数値は手元の集計と照合</text><text x="52" y="2225" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">再利用</text><text x="52" y="2260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">比較軸と依頼文を部門で共有</text><text x="32" y="2365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>