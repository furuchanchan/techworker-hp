<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2390" viewBox="0 0 520 2390" role="img" aria-labelledby="title desc"><title id="title">申請から承認・記録・通知までを接続。</title><desc id="desc">登録をきっかけに処理を進め、承認の判断は担当者が行う。。申請を登録する：SharePoint リスト。承認を依頼する：Power Automate。人が判断する：承認・差し戻し。結果を残す・伝える：リスト・Teams 等</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="520" height="2390" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Power Automate</text><text x="32" y="121" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">申請から承認・記録・通知までを</text><text x="32" y="161" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">接続。</text><rect x="32" y="210" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">01</text><text x="100" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">申請を登録する</text><path d="M52 262L468 262" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="298" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">SharePoint リスト</text><text x="52" y="338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">申請の例</text><text x="52" y="372" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">備品の購入申請</text><text x="52" y="432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">登録する項目</text><text x="52" y="466" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">申請者・内容・金額・申請ID</text><text x="52" y="526" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">開始のきっかけ</text><text x="52" y="560" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">新しい申請の登録</text><path d="M260 616L260 638" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="646" width="456" height="400" rx="6" fill="#f0f7fd" stroke="#c8d8e6"/><text x="52" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">02</text><text x="100" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">承認を依頼する</text><path d="M52 698L468 698" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="734" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">Power Automate</text><text x="52" y="774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">登録を検知</text><text x="52" y="808" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">申請内容と担当者を取得</text><text x="52" y="868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認依頼を送付</text><text x="52" y="902" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">承認者へ必要事項を渡す</text><text x="52" y="962" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">応答を待つ</text><text x="52" y="996" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">担当者による判断を受け取る</text><path d="M260 1052L260 1074" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1082" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">03</text><text x="100" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">人が判断する</text><path d="M52 1134L468 1134" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1170" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">承認・差し戻し</text><text x="52" y="1210" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認する場合</text><text x="52" y="1244" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">申請の条件・内容を確認</text><text x="52" y="1304" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差し戻す場合</text><text x="52" y="1338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">不足や修正が必要な点を通知</text><text x="52" y="1398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">結果を返す</text><text x="52" y="1432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">承認結果に応じて処理を分岐</text><path d="M260 1488L260 1510" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1518" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">04</text><text x="100" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">結果を残す・伝える</text><path d="M52 1570L468 1570" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1606" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">リスト・Teams 等</text><text x="52" y="1646" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認時の処理</text><text x="52" y="1680" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">状態を更新し、申請者へ通知</text><text x="52" y="1740" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差し戻し時の処理</text><text x="52" y="1774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">結果・確認が必要な点を案内</text><text x="52" y="1834" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">記録する情報</text><text x="52" y="1868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">申請ID・結果・処理の状況</text><rect x="32" y="1970" width="456" height="350" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="52" y="2010" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="52" y="2059" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">重複を防ぐ</text><text x="52" y="2094" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">申請IDと処理状況を確認する</text><text x="52" y="2142" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">止まった場合</text><text x="52" y="2177" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">承認待ち・失敗時の連絡先を決める</text><text x="52" y="2225" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">運用の担当</text><text x="52" y="2260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">フローの所有者と変更手順を明確に</text><text x="32" y="2365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>