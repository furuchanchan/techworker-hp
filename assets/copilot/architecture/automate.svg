<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Power Automateの申請・承認フロー</title><desc id="desc">申請を登録し、Power Automateが承認担当者へ依頼。人の判断に応じて承認または差し戻しの結果を記録・通知します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3877b8"/></marker></defs><rect width="1200" height="640" fill="#f7fbff"/><rect x="30" y="28" width="1140" height="74" rx="16" fill="#e3f2ff"/><text x="66" y="76" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="28" font-weight="700" fill="#102a43" text-anchor="start">活用・構成例</text><text x="1134" y="76" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="28" font-weight="600" fill="#102a43" text-anchor="end">Power Automate</text><rect x="40" y="246" width="200" height="148" rx="20" fill="#fff" stroke="#9cbbd4" stroke-width="2"/><text x="140.0" y="291" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">申請を登録</text><text x="140.0" y="329" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">備品購入の申請</text><text x="140.0" y="359" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">リストに保存</text><rect x="285" y="225" width="215" height="190" rx="20" fill="#e8f3ff" stroke="#9cbbd4" stroke-width="2"/><text x="392.5" y="270" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">フローを実行</text><text x="392.5" y="308" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">登録を検知</text><text x="392.5" y="338" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">承認を依頼</text><image href="data:image/svg+xml;base64," x="372" y="354" width="42" height="42"/><rect x="550" y="246" width="200" height="148" rx="20" fill="#fff" stroke="#9cbbd4" stroke-width="2"/><text x="650.0" y="291" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">担当者が判断</text><text x="650.0" y="329" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">内容・条件を確認</text><text x="650.0" y="359" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">人が承認／差し戻し</text><rect x="810" y="160" width="145" height="94" rx="20" fill="#eaf7f0" stroke="#9cbbd4" stroke-width="2"/><text x="882.5" y="205" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">承認</text><rect x="810" y="391" width="145" height="94" rx="20" fill="#fff4e7" stroke="#9cbbd4" stroke-width="2"/><text x="882.5" y="436" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">差し戻し</text><rect x="1000" y="246" width="160" height="148" rx="20" fill="#edf8f7" stroke="#9cbbd4" stroke-width="2"/><text x="1080.0" y="291" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="26" font-weight="700" fill="#102a43" text-anchor="middle">記録・通知</text><text x="1080.0" y="329" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">状態を更新</text><text x="1080.0" y="359" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="21" font-weight="500" fill="#102a43" text-anchor="middle">申請者へ通知</text><path d="M240 320H279" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M500 320H544" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M750 285L804 210" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M750 355L804 438" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M955 207L995 280" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M955 438L995 362" stroke="#3877b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="600" y="559" font-family="Hiragino Sans,Yu Gothic,sans-serif" font-size="22" font-weight="500" fill="#102a43" text-anchor="middle">定めた手順で処理をつなぎ、判断は承認担当者が行います。</text></svg>