<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><title id="title">売上の変化を、次に確かめる論点へ。</title><desc id="desc">整えた表をもとに傾向を整理し、数値と解釈を人が検証する。。表を整える：売上データ。傾向を整理する：Copilot in Excel。数値を検証する：元データと照合。判断の材料にする：分析メモ・確認事項</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="1440" height="910" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Excel</text><text x="1248" y="57" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#506880">活用・構成例</text><text x="40" y="126" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="40" font-weight="700" fill="#17334f">売上の変化を、次に確かめる論点へ。</text><text x="40" y="169" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#506880">整えた表をもとに傾向を整理し、数値と解釈を人が検証する。</text><text x="40" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">01</text><text x="90" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">表を整える</text><rect x="40" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">売上データ</text><path d="M60 326L330 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">列の例</text><text x="60" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">年月・部門・商品・売上</text><text x="60" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">対象を指定</text><text x="60" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">期間・単位・比較する範囲</text><text x="60" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">データを確認</text><text x="60" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">欠損・重複・合計行の扱い</text><path d="M354 424L382 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">02</text><text x="440" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">傾向を整理する</text><rect x="390" y="252" width="310" height="400" rx="6" fill="#f0f7fd" stroke="#97bddb"/><text x="410" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Excel</text><path d="M410 326L680 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="410" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">比較軸を指定</text><text x="410" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">月別・部門別・商品別</text><text x="410" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差分を確認</text><text x="410" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">増減の大きい項目を抽出</text><text x="410" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">論点を分ける</text><text x="410" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">確認できた事実と仮説</text><path d="M704 424L732 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="740" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">03</text><text x="790" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">数値を検証する</text><rect x="740" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="760" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">元データと照合</text><path d="M760 326L1030 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="760" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">集計を確認</text><text x="760" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">計算式・分母・対象期間</text><text x="760" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">解釈を確認</text><text x="760" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">相関と原因を区別する</text><text x="760" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">不足を洗い出す</text><text x="760" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">追加で必要なデータを整理</text><path d="M1054 424L1082 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">04</text><text x="1140" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">判断の材料にする</text><rect x="1090" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="1110" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">分析メモ・確認事項</text><path d="M1110 326L1380 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="1110" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">傾向の要約</text><text x="1110" y="398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">どの部門・商品が変化した</text><text x="1110" y="427" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">か</text><text x="1110" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">大きな変化</text><text x="1110" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">増減を確認した対象項目</text><text x="1110" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">次に調べること</text><text x="1110" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">要因を確かめる追加の分析</text><rect x="40" y="692" width="1360" height="151" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="62" y="730" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="62" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">更新の手順</text><text x="62" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">データ更新時に分析範囲を確認</text><path d="M492 749L492 821" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="512" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">品質の確認</text><text x="512" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">重要な数値は手元の集計と照合</text><path d="M942 749L942 821" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="962" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">再利用</text><text x="962" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">比較軸と依頼文を部門で共有</text><text x="40" y="885" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>