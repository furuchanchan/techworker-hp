<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2390" viewBox="0 0 520 2390" role="img" aria-labelledby="title desc"><title id="title">報告の材料を、伝わるスライドへ。</title><desc id="desc">読み手と結論を決め、構成・初稿をつくってから資料を磨く。。材料を準備する：報告メモ・参考文書。初稿をつくる：Copilot in PowerPoint。内容を整える：担当者がレビュー。報告・説明に使う：スライド資料</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="520" height="2390" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in PowerPoint</text><text x="32" y="121" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">報告の材料を、</text><text x="32" y="161" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">伝わるスライドへ。</text><rect x="32" y="210" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">01</text><text x="100" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">材料を準備する</text><path d="M52 262L468 262" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="298" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">報告メモ・参考文書</text><text x="52" y="338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">結論を決める</text><text x="52" y="372" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">読み手に判断してほしいこと</text><text x="52" y="432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">根拠をそろえる</text><text x="52" y="466" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">最新の数値・出典・参考文書</text><text x="52" y="526" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">条件を指定</text><text x="52" y="560" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">用途・持ち時間・枚数</text><path d="M260 616L260 638" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="646" width="456" height="400" rx="6" fill="#f0f7fd" stroke="#c8d8e6"/><text x="52" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">02</text><text x="100" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">初稿をつくる</text><path d="M52 698L468 698" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="734" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">Copilot in PowerPoint</text><text x="52" y="774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">構成を整理</text><text x="52" y="808" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">結論 → 根拠 → 課題 → 方</text><text x="52" y="837" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">針</text><text x="52" y="868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">要点を配置</text><text x="52" y="902" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">１枚につき主張は一つ</text><text x="52" y="962" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">下書きを作成</text><text x="52" y="996" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">見出しと説明の要点を生成</text><path d="M260 1052L260 1074" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1082" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">03</text><text x="100" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">内容を整える</text><path d="M52 1134L468 1134" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1170" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">担当者がレビュー</text><text x="52" y="1210" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">内容を照合</text><text x="52" y="1244" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">数値・出典・結論との対応</text><text x="52" y="1304" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">見せ方を調整</text><text x="52" y="1338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">図表・文字量・説明の順序</text><text x="52" y="1398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">社内様式に統一</text><text x="52" y="1432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">テンプレートや表現を整える</text><path d="M260 1488L260 1510" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1518" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">04</text><text x="100" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">報告・説明に使う</text><path d="M52 1570L468 1570" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1606" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">スライド資料</text><text x="52" y="1646" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">01 結論</text><text x="52" y="1680" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">今回、判断してほしいこと</text><text x="52" y="1740" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">02 根拠と課題</text><text x="52" y="1774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">結論を支えるデータと論点</text><text x="52" y="1834" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">03 次の打ち手</text><text x="52" y="1868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">実施内容・担当・確認事項</text><rect x="32" y="1970" width="456" height="350" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="52" y="2010" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="52" y="2059" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">資料の型</text><text x="52" y="2094" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">部門の構成とテンプレートを共有</text><text x="52" y="2142" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">使用条件</text><text x="52" y="2177" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">グラフ・画像・引用の条件を確認</text><text x="52" y="2225" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">担当の分担</text><text x="52" y="2260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">初稿作成と最終確認を分ける</text><text x="32" y="2365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>