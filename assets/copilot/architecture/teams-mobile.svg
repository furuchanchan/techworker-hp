<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2390" viewBox="0 0 520 2390" role="img" aria-labelledby="title desc"><title id="title">会議の議論を、次のアクションへ。</title><desc id="desc">文字起こしから要点を整理し、担当と期限を合意して共有する。。会議内容を残す：会議の文字起こし。要点を整理する：Copilot in Teams。関係者が確認する：記録と合意を確認。業務につなげる：議事録・タスク</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="520" height="2390" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Teams</text><text x="32" y="121" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">会議の議論を、</text><text x="32" y="161" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">次のアクションへ。</text><rect x="32" y="210" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">01</text><text x="100" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">会議内容を残す</text><path d="M52 262L468 262" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="298" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">会議の文字起こし</text><text x="52" y="338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">記録する情報</text><text x="52" y="372" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">議論・発言・決定の経緯</text><text x="52" y="432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">事前にそろえる</text><text x="52" y="466" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">議題・用語・確認したい論点</text><text x="52" y="526" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">利用条件を確認</text><text x="52" y="560" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">会議後の参照には文字起こし</text><path d="M260 616L260 638" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="646" width="456" height="400" rx="6" fill="#f0f7fd" stroke="#c8d8e6"/><text x="52" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">02</text><text x="100" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">要点を整理する</text><path d="M52 698L468 698" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="734" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">Copilot in Teams</text><text x="52" y="774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">決定事項を抽出</text><text x="52" y="808" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">決まったこと・保留したこと</text><text x="52" y="868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">アクションを整理</text><text x="52" y="902" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">やること・担当者・期限</text><text x="52" y="962" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">不明点を区別</text><text x="52" y="996" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">未確定の項目は補わない</text><path d="M260 1052L260 1074" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1082" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">03</text><text x="100" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">関係者が確認する</text><path d="M52 1134L468 1134" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1170" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">記録と合意を確認</text><text x="52" y="1210" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">原発言と照合</text><text x="52" y="1244" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">固有名詞・数値・決定の有無</text><text x="52" y="1304" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">役割を確定</text><text x="52" y="1338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">担当者と期限を関係者で合意</text><text x="52" y="1398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">公開範囲を確認</text><text x="52" y="1432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">議事録・タスクの共有先</text><path d="M260 1488L260 1510" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1518" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">04</text><text x="100" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">業務につなげる</text><path d="M52 1570L468 1570" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1606" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">議事録・タスク</text><text x="52" y="1646" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">決定事項</text><text x="52" y="1680" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">会議で合意した内容</text><text x="52" y="1740" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">未決事項</text><text x="52" y="1774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">次回までに確認する論点</text><text x="52" y="1834" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">アクション</text><text x="52" y="1868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">担当者・期限付きの対応事項</text><rect x="32" y="1970" width="456" height="350" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="52" y="2010" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="52" y="2059" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">記録の扱い</text><text x="52" y="2094" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">文字起こし・共有先を社内ルールに統</text><text x="52" y="2122" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">一</text><text x="52" y="2142" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">最終確認</text><text x="52" y="2177" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">会議ごとに議事録の確認者を決める</text><text x="52" y="2225" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">定着の工夫</text><text x="52" y="2260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">要約の修正点を依頼文へ反映</text><text x="32" y="2365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>