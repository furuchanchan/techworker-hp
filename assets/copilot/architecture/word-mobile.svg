<svg xmlns="http://www.w3.org/2000/svg" width="520" height="2390" viewBox="0 0 520 2390" role="img" aria-labelledby="title desc"><title id="title">商談の情報を、判断できる提案書へ。</title><desc id="desc">顧客の発言と営業の仮説を分け、構成案から本文へ進める。。材料をそろえる：商談メモ・参考資料。構成・下書きを作る：Copilot in Word。担当者が確認する：事実・条件を照合。提案に使う：提案書の構成・本文</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="520" height="2390" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Word</text><text x="32" y="121" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">商談の情報を、</text><text x="32" y="161" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="30" font-weight="700" fill="#17334f">判断できる提案書へ。</text><rect x="32" y="210" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">01</text><text x="100" y="245" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">材料をそろえる</text><path d="M52 262L468 262" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="298" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">商談メモ・参考資料</text><text x="52" y="338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">顧客の課題</text><text x="52" y="372" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">現状の業務と困りごと</text><text x="52" y="432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">提案の条件</text><text x="52" y="466" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">対象範囲・時期・予算</text><text x="52" y="526" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">未確認の情報</text><text x="52" y="560" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">仮説と確定事項を区別</text><path d="M260 616L260 638" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="646" width="456" height="400" rx="6" fill="#f0f7fd" stroke="#c8d8e6"/><text x="52" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">02</text><text x="100" y="681" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">構成・下書きを作る</text><path d="M52 698L468 698" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="734" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">Copilot in Word</text><text x="52" y="774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">読み手を指定</text><text x="52" y="808" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">誰に何を判断してもらうか</text><text x="52" y="868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">章立てを整理</text><text x="52" y="902" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">課題・方針・確認事項</text><text x="52" y="962" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">本文を下書き</text><text x="52" y="996" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">情報不足は未確認と明記</text><path d="M260 1052L260 1074" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1082" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">03</text><text x="100" y="1117" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">担当者が確認する</text><path d="M52 1134L468 1134" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1170" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">事実・条件を照合</text><text x="52" y="1210" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">原資料と比較</text><text x="52" y="1244" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">顧客名・金額・日程</text><text x="52" y="1304" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">根拠を点検</text><text x="52" y="1338" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">数値や効果の言い切り</text><text x="52" y="1398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">合意を確認</text><text x="52" y="1432" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">未合意の条件を確定しない</text><path d="M260 1488L260 1510" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="1518" width="456" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="52" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">04</text><text x="100" y="1553" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">提案に使う</text><path d="M52 1570L468 1570" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="52" y="1606" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="28" font-weight="700" fill="#17334f">提案書の構成・本文</text><text x="52" y="1646" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">01 現状の課題</text><text x="52" y="1680" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">顧客の発言・事実を整理</text><text x="52" y="1740" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">02 提案の方針</text><text x="52" y="1774" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">取り組む内容と対象範囲</text><text x="52" y="1834" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">03 次回の確認</text><text x="52" y="1868" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#17334f">不足情報・判断が必要な点</text><rect x="32" y="1970" width="456" height="350" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="52" y="2010" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="26" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="52" y="2059" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">共通の型</text><text x="52" y="2094" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">入力メモと提案書の章立てを統一</text><text x="52" y="2142" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">レビュー体制</text><text x="52" y="2177" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">作成担当と提出前の確認担当を決める</text><text x="52" y="2225" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">改善の記録</text><text x="52" y="2260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="500" fill="#17334f">修正した表現を依頼文へ反映</text><text x="32" y="2365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>