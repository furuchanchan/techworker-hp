<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1470" viewBox="0 0 1000 1470" role="img" aria-labelledby="title desc"><title id="title">申請から承認・記録・通知までを接続。</title><desc id="desc">登録をきっかけに処理を進め、承認の判断は担当者が行う。。申請を登録する：SharePoint リスト。承認を依頼する：Power Automate。人が判断する：承認・差し戻し。結果を残す・伝える：リスト・Teams 等</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="1000" height="1470" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Power Automate</text><text x="808" y="57" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#506880">活用・構成例</text><text x="40" y="126" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#17334f">申請から承認・記録・通知までを接続。</text><text x="40" y="169" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#506880">登録をきっかけに処理を進め、承認の判断は担当者が行う。</text><text x="40" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">01</text><text x="90" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">申請を登録する</text><rect x="40" y="252" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">SharePoint リスト</text><path d="M60 326L460 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">申請の例</text><text x="60" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">備品の購入申請</text><text x="60" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">登録する項目</text><text x="60" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">申請者・内容・金額・申請ID</text><text x="60" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">開始のきっかけ</text><text x="60" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">新しい申請の登録</text><path d="M484 424L512 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">02</text><text x="570" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">承認を依頼する</text><rect x="520" y="252" width="440" height="400" rx="6" fill="#f0f7fd" stroke="#97bddb"/><text x="540" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Power Automate</text><path d="M540 326L940 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="540" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">登録を検知</text><text x="540" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">申請内容と担当者を取得</text><text x="540" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認依頼を送付</text><text x="540" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">承認者へ必要事項を渡す</text><text x="540" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">応答を待つ</text><text x="540" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">担当者による判断を受け取る</text><text x="735" y="682" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="600" fill="#0078d4">続いて 03 へ ↓</text><text x="40" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">03</text><text x="90" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">人が判断する</text><rect x="40" y="732" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="781" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">承認・差し戻し</text><path d="M60 806L460 806" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="845" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認する場合</text><text x="60" y="881" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">申請の条件・内容を確認</text><text x="60" y="933" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差し戻す場合</text><text x="60" y="969" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">不足や修正が必要な点を通知</text><text x="60" y="1021" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">結果を返す</text><text x="60" y="1057" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">承認結果に応じて処理を分岐</text><path d="M484 904L512 904" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">04</text><text x="570" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">結果を残す・伝える</text><rect x="520" y="732" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="540" y="781" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">リスト・Teams 等</text><path d="M540 806L940 806" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="540" y="845" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">承認時の処理</text><text x="540" y="881" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">状態を更新し、申請者へ通知</text><text x="540" y="933" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">差し戻し時の処理</text><text x="540" y="969" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">結果・確認が必要な点を案内</text><text x="540" y="1021" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">記録する情報</text><text x="540" y="1057" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">申請ID・結果・処理の状況</text><rect x="40" y="1180" width="920" height="210" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="62" y="1218" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="62" y="1260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">重複を防ぐ</text><text x="380" y="1260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">申請IDと処理状況を確認する</text><text x="62" y="1310" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">止まった場合</text><text x="380" y="1310" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">承認待ち・失敗時の連絡先を決める</text><text x="62" y="1360" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">運用の担当</text><text x="380" y="1360" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">フローの所有者と変更手順を明確に</text><text x="40" y="1445" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>