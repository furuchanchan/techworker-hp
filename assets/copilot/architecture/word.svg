<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><title id="title">商談の情報を、判断できる提案書へ。</title><desc id="desc">顧客の発言と営業の仮説を分け、構成案から本文へ進める。。材料をそろえる：商談メモ・参考資料。構成・下書きを作る：Copilot in Word。担当者が確認する：事実・条件を照合。提案に使う：提案書の構成・本文</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="1440" height="910" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Word</text><text x="1248" y="57" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#506880">活用・構成例</text><text x="40" y="126" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="40" font-weight="700" fill="#17334f">商談の情報を、判断できる提案書へ。</text><text x="40" y="169" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#506880">顧客の発言と営業の仮説を分け、構成案から本文へ進める。</text><text x="40" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">01</text><text x="90" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">材料をそろえる</text><rect x="40" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">商談メモ・参考資料</text><path d="M60 326L330 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">顧客の課題</text><text x="60" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">現状の業務と困りごと</text><text x="60" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">提案の条件</text><text x="60" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">対象範囲・時期・予算</text><text x="60" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">未確認の情報</text><text x="60" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">仮説と確定事項を区別</text><path d="M354 424L382 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">02</text><text x="440" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">構成・下書きを作る</text><rect x="390" y="252" width="310" height="400" rx="6" fill="#f0f7fd" stroke="#97bddb"/><text x="410" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Word</text><path d="M410 326L680 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="410" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">読み手を指定</text><text x="410" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">誰に何を判断してもらうか</text><text x="410" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">章立てを整理</text><text x="410" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">課題・方針・確認事項</text><text x="410" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">本文を下書き</text><text x="410" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">情報不足は未確認と明記</text><path d="M704 424L732 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="740" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">03</text><text x="790" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">担当者が確認する</text><rect x="740" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="760" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">事実・条件を照合</text><path d="M760 326L1030 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="760" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">原資料と比較</text><text x="760" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">顧客名・金額・日程</text><text x="760" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">根拠を点検</text><text x="760" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">数値や効果の言い切り</text><text x="760" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">合意を確認</text><text x="760" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">未合意の条件を確定しない</text><path d="M1054 424L1082 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">04</text><text x="1140" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">提案に使う</text><rect x="1090" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="1110" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">提案書の構成・本文</text><path d="M1110 326L1380 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="1110" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">01 現状の課題</text><text x="1110" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">顧客の発言・事実を整理</text><text x="1110" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">02 提案の方針</text><text x="1110" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">取り組む内容と対象範囲</text><text x="1110" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">03 次回の確認</text><text x="1110" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">不足情報・判断が必要な点</text><rect x="40" y="692" width="1360" height="151" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="62" y="730" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="62" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">共通の型</text><text x="62" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">入力メモと提案書の章立てを統一</text><path d="M492 749L492 821" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="512" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">レビュー体制</text><text x="512" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">作成担当と提出前の確認担当を決める</text><path d="M942 749L942 821" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="962" y="773" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#0078d4">改善の記録</text><text x="962" y="812" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">修正した表現を依頼文へ反映</text><text x="40" y="885" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>