<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><title id="title">会議の議論を、次のアクションへ。</title><desc id="desc">文字起こしから要点を整理し、担当と期限を合意して共有する。。会議内容を残す：会議の文字起こし。要点を整理する：Copilot in Teams。関係者が確認する：記録と合意を確認。業務につなげる：議事録・タスク</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="1440" height="910" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Teams</text><text x="1248" y="57" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#506880">活用・構成例</text><text x="40" y="126" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="40" font-weight="700" fill="#17334f">会議の議論を、次のアクションへ。</text><text x="40" y="169" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#506880">文字起こしから要点を整理し、担当と期限を合意して共有する。</text><text x="40" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">01</text><text x="90" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">会議内容を残す</text><rect x="40" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">会議の文字起こし</text><path d="M60 326L330 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">記録する情報</text><text x="60" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">議論・発言・決定の経緯</text><text x="60" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">事前にそろえる</text><text x="60" y="486" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">議題・用語・</text><text x="60" y="515" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">確認したい論点</text><text x="60" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">利用条件を確認</text><text x="60" y="574" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">会議後の参照には文字起こ</text><text x="60" y="603" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">し</text><path d="M354 424L382 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">02</text><text x="440" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">要点を整理する</text><rect x="390" y="252" width="310" height="400" rx="6" fill="#f0f7fd" stroke="#97bddb"/><text x="410" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in Teams</text><path d="M410 326L680 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="410" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">決定事項を抽出</text><text x="410" y="398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">決まったこと・</text><text x="410" y="427" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">保留したこと</text><text x="410" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">アクションを整理</text><text x="410" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">やること・担当者・期限</text><text x="410" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">不明点を区別</text><text x="410" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">未確定の項目は補わない</text><path d="M704 424L732 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="740" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">03</text><text x="790" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">関係者が確認する</text><rect x="740" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="760" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">記録と合意を確認</text><path d="M760 326L1030 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="760" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">原発言と照合</text><text x="760" y="398" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">固有名詞・数値・</text><text x="760" y="427" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">決定の有無</text><text x="760" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">役割を確定</text><text x="760" y="486" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">担当者と期限を関係者で合</text><text x="760" y="515" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">意</text><text x="760" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">公開範囲を確認</text><text x="760" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">議事録・タスクの共有先</text><path d="M1054 424L1082 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">04</text><text x="1140" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">業務につなげる</text><rect x="1090" y="252" width="310" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="1110" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">議事録・タスク</text><path d="M1110 326L1380 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="1110" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">決定事項</text><text x="1110" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">会議で合意した内容</text><text x="1110" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">未決事項</text><text x="1110" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">次回までに確認する論点</text><text x="1110" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#5