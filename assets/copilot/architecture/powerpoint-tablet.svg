<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1470" viewBox="0 0 1000 1470" role="img" aria-labelledby="title desc"><title id="title">報告の材料を、伝わるスライドへ。</title><desc id="desc">読み手と結論を決め、構成・初稿をつくってから資料を磨く。。材料を準備する：報告メモ・参考文書。初稿をつくる：Copilot in PowerPoint。内容を整える：担当者がレビュー。報告・説明に使う：スライド資料</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0078d4"/></marker></defs><rect x="0" y="0" width="1000" height="1470" rx="0" fill="#fff" stroke="#fff"/><image x="32" y="28" width="44" height="44" href="data:image/svg+xml;base64,"/><text x="92" y="59" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">Copilot in PowerPoint</text><text x="808" y="57" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#506880">活用・構成例</text><text x="40" y="126" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="34" font-weight="700" fill="#17334f">報告の材料を、伝わるスライドへ。</text><text x="40" y="169" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="25" font-weight="500" fill="#506880">読み手と結論を決め、構成・初稿をつくってから資料を磨く。</text><text x="40" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">01</text><text x="90" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">材料を準備する</text><rect x="40" y="252" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">報告メモ・参考文書</text><path d="M60 326L460 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">結論を決める</text><text x="60" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">読み手に判断してほしいこと</text><text x="60" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">根拠をそろえる</text><text x="60" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">最新の数値・出典・参考文書</text><text x="60" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">条件を指定</text><text x="60" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">用途・持ち時間・枚数</text><path d="M484 424L512 424" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">02</text><text x="570" y="224" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">初稿をつくる</text><rect x="520" y="252" width="440" height="400" rx="6" fill="#f0f7fd" stroke="#97bddb"/><text x="540" y="301" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="24" font-weight="700" fill="#17334f">Copilot in PowerPoint</text><path d="M540 326L940 326" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="540" y="365" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">構成を整理</text><text x="540" y="401" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">結論 → 根拠 → 課題 → 方針</text><text x="540" y="453" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">要点を配置</text><text x="540" y="489" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">１枚につき主張は一つ</text><text x="540" y="541" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">下書きを作成</text><text x="540" y="577" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">見出しと説明の要点を生成</text><text x="735" y="682" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="600" fill="#0078d4">続いて 03 へ ↓</text><text x="40" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">03</text><text x="90" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">内容を整える</text><rect x="40" y="732" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="60" y="781" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">担当者がレビュー</text><path d="M60 806L460 806" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="60" y="845" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">内容を照合</text><text x="60" y="881" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">数値・出典・結論との対応</text><text x="60" y="933" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">見せ方を調整</text><text x="60" y="969" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">図表・文字量・説明の順序</text><text x="60" y="1021" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">社内様式に統一</text><text x="60" y="1057" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">テンプレートや表現を整える</text><path d="M484 904L512 904" fill="none" stroke="#0078d4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="650" fill="#0078d4">04</text><text x="570" y="704" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">報告・説明に使う</text><rect x="520" y="732" width="440" height="400" rx="6" fill="#fff" stroke="#c8d8e6"/><text x="540" y="781" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700" fill="#17334f">スライド資料</text><path d="M540 806L940 806" fill="none" stroke="#c8d8e6" stroke-width="1"/><text x="540" y="845" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">01 結論</text><text x="540" y="881" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">今回、判断してほしいこと</text><text x="540" y="933" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">02 根拠と課題</text><text x="540" y="969" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">結論を支えるデータと論点</text><text x="540" y="1021" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="650" fill="#506880">03 次の打ち手</text><text x="540" y="1057" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="22" font-weight="500" fill="#17334f">実施内容・担当・確認事項</text><rect x="40" y="1180" width="920" height="210" rx="6" fill="#f5f8fb" stroke="#e2ebf3"/><text x="62" y="1218" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#17334f">実務で使い続けるための設計</text><text x="62" y="1260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">資料の型</text><text x="380" y="1260" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">部門の構成とテンプレートを共有</text><text x="62" y="1310" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">使用条件</text><text x="380" y="1310" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">グラフ・画像・引用の条件を確認</text><text x="62" y="1360" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700" fill="#0078d4">担当の分担</text><text x="380" y="1360" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="500" fill="#17334f">初稿作成と最終確認を分ける</text><text x="40" y="1445" font-family="Hiragino Sans,Yu Gothic,Noto Sans JP,sans-serif" font-size="21" font-weight="500" fill="#506880">具体的な入力・出力は、説明のための例です。</text></svg>