<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#145da0">AIインタビュー・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">声の推定を調査結論へ入れる前の検査</text><text x="70" y="196" font-size="32" fill="#334155">感情ラベルを本音や虚偽の判定に使わない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#145da0" font-size="46" font-weight="700">特徴を観測</text><text x="92" y="344" fill="#334155" font-size="36">間や話速を事実で残す</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#145da0" font-size="46" font-weight="700">推定を分離</text><text x="642" y="344" fill="#334155" font-size="36">感情ラベルを別欄へ</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#145da0" font-size="46" font-weight="700">偏りを検査</text><text x="92" y="509" fill="#334155" font-size="36">話者群と録音条件で比べる</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#145da0" font-size="46" font-weight="700">結論を制限</text><text x="642" y="509" fill="#334155" font-size="36">本音や虚偽を断定しない</text></g></svg>