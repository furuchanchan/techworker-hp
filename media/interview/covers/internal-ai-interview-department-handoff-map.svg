<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#145da0">AIインタビュー・ラボ</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">部署間の受け渡しを業務図へつなぐ</text><text x="70" y="196" font-size="32" fill="#334155">両側の条件を照合してから矢印を確定する</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="287" fill="#145da0" font-size="42" font-weight="700">範囲を決める</text><text x="92" y="342" fill="#334155" font-size="34">仕事の始まりと終わり</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="287" fill="#145da0" font-size="42" font-weight="700">両側へ聞く</text><text x="642" y="342" fill="#334155" font-size="34">渡す物と受取条件</text><rect x="70" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="457" fill="#145da0" font-size="42" font-weight="700">証拠を照合</text><text x="92" y="512" fill="#334155" font-size="34">資料・ログ・観察</text><rect x="620" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="457" fill="#145da0" font-size="42" font-weight="700">図へ反映</text><text x="642" y="512" fill="#334155" font-size="34">未確認を残して描く</text></g></svg>