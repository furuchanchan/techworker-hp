<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#145da0">AIインタビュー・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">センシティブな回答が出た後の分岐</text><text x="70" y="196" font-size="32" fill="#334155">AIに聞き続ける権限を渡さない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#145da0" font-size="46" font-weight="700">兆候を検知</text><text x="92" y="344" fill="#334155" font-size="35">単語だけで危険を断定しない</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#145da0" font-size="46" font-weight="700">会話を一時停止</text><text x="642" y="344" fill="#334155" font-size="36">参加者へ選択権を戻す</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#145da0" font-size="46" font-weight="700">逐語で記録</text><text x="92" y="509" fill="#334155" font-size="36">要約と担当判断を分ける</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#145da0" font-size="46" font-weight="700">人へ引き継ぐ</text><text x="642" y="509" fill="#334155" font-size="36">応答できる時間だけ実施</text></g></svg>