<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#145da0">AIインタビュー・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">逐語録を分析へ渡す前の検証</text><text x="70" y="196" font-size="32" fill="#334155">重要な判断を変える誤りから止める</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#145da0" font-size="46" font-weight="700">文字の誤りを測る</text><text x="92" y="344" fill="#334155" font-size="36">置換・削除・挿入</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#145da0" font-size="46" font-weight="700">話者の帰属を確認</text><text x="642" y="344" fill="#334155" font-size="36">発言者の入替を検知</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#145da0" font-size="46" font-weight="700">分析差分を比べる</text><text x="92" y="509" fill="#334155" font-size="36">要約・引用まで照合</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#145da0" font-size="46" font-weight="700">用途別に採否判断</text><text x="642" y="509" fill="#334155" font-size="36">重要語の誤りで停止</text></g></svg>