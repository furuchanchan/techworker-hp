<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#145da0">AIインタビュー・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">要約を意思決定へ渡す前の監査</text><text x="70" y="196" font-size="32" fill="#334155">原文へ戻れない結論は採用しない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#145da0" font-size="46" font-weight="700">結論を一文へ分解</text><text x="92" y="344" fill="#334155" font-size="36">判断単位を小さく固定</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#145da0" font-size="46" font-weight="700">原文の引用へ接続</text><text x="642" y="344" fill="#334155" font-size="36">回答者と発話位置を記録</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#145da0" font-size="46" font-weight="700">反対事例を逆探索</text><text x="92" y="509" fill="#334155" font-size="36">欠落と条件付きを確認</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#145da0" font-size="46" font-weight="700">用途ごとに採否判断</text><text x="642" y="509" fill="#334155" font-size="36">重要誤りがあれば停止</text></g></svg>