<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#932c36">AIセキュリティ・ラボ</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">CSV出力を守る4段階</text><text x="70" y="196" font-size="32" fill="#334155">形式検査と数式の無害化を分ける</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="287" fill="#932c36" font-size="42" font-weight="700">出力用途を分離</text><text x="92" y="342" fill="#334155" font-size="34">機械用と閲覧用を混ぜない</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="287" fill="#932c36" font-size="42" font-weight="700">セル値を型検査</text><text x="642" y="342" fill="#334155" font-size="34">数値・日付・自由文を分ける</text><rect x="70" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="457" fill="#932c36" font-size="42" font-weight="700">表示用に無害化</text><text x="92" y="512" fill="#334155" font-size="34">元データと変換後を分ける</text><rect x="620" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="457" fill="#932c36" font-size="42" font-weight="700">実アプリで再検証</text><text x="642" y="512" fill="#334155" font-size="34">保存と再読込みまで試す</text></g></svg>