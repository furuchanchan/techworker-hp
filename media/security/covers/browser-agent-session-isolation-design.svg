<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#932c36">AIセキュリティ・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">ブラウザAIの権限を分ける</text><text x="70" y="196" font-size="32" fill="#334155">プロファイル分離だけでは書き込みを防げない</text><rect x="70" y="225" width="1060" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="94" y="276" fill="#932c36" font-size="44" font-weight="700">匿名調査</text><text x="550" y="276" fill="#334155" font-size="38">新規プロファイル</text><rect x="70" y="312" width="1060" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="94" y="363" fill="#932c36" font-size="44" font-weight="700">認証済み閲覧</text><text x="550" y="363" fill="#334155" font-size="38">閲覧権限・操作制限</text><rect x="70" y="399" width="1060" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="94" y="450" fill="#932c36" font-size="44" font-weight="700">送信・更新</text><text x="550" y="450" fill="#334155" font-size="38">実行直前に人が確認</text><rect x="70" y="486" width="1060" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="94" y="537" fill="#932c36" font-size="44" font-weight="700">異常終了</text><text x="550" y="537" fill="#334155" font-size="38">停止・証拠保全が先</text></g></svg>