<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#932c36">AIセキュリティ・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">webhookから業務実行までの4検査</text><text x="70" y="196" font-size="32" fill="#334155">署名成功だけで業務を実行しない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#932c36" font-size="46" font-weight="700">1. 生本文で署名確認</text><text x="92" y="344" fill="#334155" font-size="36">送信元と改ざん有無を確認</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#932c36" font-size="46" font-weight="700">2. 時刻とIDを確認</text><text x="642" y="344" fill="#334155" font-size="36">古い通知と重複を拒否</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#932c36" font-size="46" font-weight="700">3. 業務を冪等化</text><text x="92" y="509" fill="#334155" font-size="35">再実行でも結果を増やさない</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#932c36" font-size="46" font-weight="700">4. 現在権限を再確認</text><text x="642" y="509" fill="#334155" font-size="36">対象と操作の許可を照合</text></g></svg>