<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#493aa0">AI基盤ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">読み取りを二経路へ分ける</text><text x="70" y="196" font-size="32" fill="#334155">最新値が必要な処理ではキャッシュを使わない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#493aa0" font-size="46" font-weight="700">認証・権限確認</text><text x="92" y="344" fill="#334155" font-size="36">キャッシュ無効へ</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#493aa0" font-size="46" font-weight="700">公開記事・一覧</text><text x="642" y="344" fill="#334155" font-size="36">遅延許容なら有効へ</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#493aa0" font-size="46" font-weight="700">書き込み直後</text><text x="92" y="509" fill="#334155" font-size="36">最新値をDBから取得</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#493aa0" font-size="46" font-weight="700">接続数の予算</text><text x="642" y="509" fill="#334155" font-size="36">二つの設定を合算</text></g></svg>