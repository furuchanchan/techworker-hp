<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#493aa0">AI基盤ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">埋め込みモデルの索引移行</text><text x="70" y="196" font-size="32" fill="#334155">旧新を混ぜず、評価後に向き先だけ変える</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#493aa0" font-size="46" font-weight="700">1. 索引版を固定</text><text x="92" y="344" fill="#334155" font-size="36">モデル・次元・用途を記録</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#493aa0" font-size="46" font-weight="700">2. 新索引を別に作成</text><text x="642" y="344" fill="#334155" font-size="36">原文から全件を再生成</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#493aa0" font-size="46" font-weight="700">3. 同じ質問で比較</text><text x="92" y="509" fill="#334155" font-size="36">根拠順位と欠落を評価</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#493aa0" font-size="46" font-weight="700">4. 参照先を切替</text><text x="642" y="509" fill="#334155" font-size="36">旧索引へ戻せる状態を維持</text></g></svg>