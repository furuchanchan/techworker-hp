<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#493aa0">AI基盤ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">schema v1からv2への移行</text><text x="70" y="196" font-size="32" fill="#334155">利用側を先に二重読取へ変える</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#493aa0" font-size="46" font-weight="700">業務契約の版を固定</text><text x="92" y="344" fill="#334155" font-size="36">適用schema番号を確定</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#493aa0" font-size="46" font-weight="700">提供先別schema変換</text><text x="642" y="344" fill="#334155" font-size="36">対応範囲に合わせて縮める</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#493aa0" font-size="46" font-weight="700">利用側の新旧二重読取</text><text x="92" y="509" fill="#334155" font-size="36">新旧両版を同時に受ける</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#493aa0" font-size="46" font-weight="700">差分検証後に旧版廃止</text><text x="642" y="509" fill="#334155" font-size="36">判断差を確認して停止する</text></g></svg>