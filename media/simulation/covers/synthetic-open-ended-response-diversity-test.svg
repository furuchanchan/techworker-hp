<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#14676a">生活者デジタルツイン・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">合成自由回答の多様性を判定する工程</text><text x="70" y="196" font-size="32" fill="#334155">生成件数を独立した生活者の人数と数えない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#14676a" font-size="46" font-weight="700">1. 原文を固定</text><text x="92" y="344" fill="#334155" font-size="36">実行条件ごとに保存する</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#14676a" font-size="46" font-weight="700">2. 意味を分類</text><text x="642" y="344" fill="#334155" font-size="36">言い換えを一群にまとめる</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#14676a" font-size="46" font-weight="700">3. 人と比較</text><text x="92" y="509" fill="#334155" font-size="36">保留回答を同じ軸で見る</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#14676a" font-size="46" font-weight="700">4. 用途を制限</text><text x="642" y="509" fill="#334155" font-size="36">発生率の判断には使わない</text></g></svg>