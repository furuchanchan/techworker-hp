<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#14676a">生活者デジタルツイン・ラボ</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">商品画像を評価する前の検査</text><text x="70" y="196" font-size="32" fill="#334155">画像理解を消費者の反応と混同しない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="287" fill="#14676a" font-size="42" font-weight="700">対応を確認</text><text x="92" y="342" fill="#334155" font-size="34">画像がモデルへ渡るか</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="287" fill="#14676a" font-size="42" font-weight="700">読み取り検査</text><text x="642" y="342" fill="#334155" font-size="34">文字・形・配置を確認</text><rect x="70" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="457" fill="#14676a" font-size="42" font-weight="700">条件を分離</text><text x="92" y="512" fill="#334155" font-size="34">画像版と表示サイズ</text><rect x="620" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="457" fill="#14676a" font-size="42" font-weight="700">実査へ渡す</text><text x="642" y="512" fill="#334155" font-size="34">反応は仮説として扱う</text></g></svg>