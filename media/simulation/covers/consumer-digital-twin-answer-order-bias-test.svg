<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#14676a">生活者デジタルツイン・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">表示順による順位反転の受入試験</text><text x="70" y="196" font-size="32" fill="#334155">位置とともに動く選択率は採用しない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#14676a" font-size="46" font-weight="700">均衡して循環</text><text x="92" y="344" fill="#334155" font-size="36">各候補を各位置へ一度配置</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#14676a" font-size="46" font-weight="700">逆順群を分離</text><text x="642" y="344" fill="#334155" font-size="36">方向の影響を別に確認</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#14676a" font-size="46" font-weight="700">ラベルを外す</text><text x="92" y="509" fill="#334155" font-size="36">A・B・Cの癖を分離</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#14676a" font-size="46" font-weight="700">順位反転を判定</text><text x="642" y="509" fill="#334155" font-size="36">動く結果は仮説まで</text></g></svg>