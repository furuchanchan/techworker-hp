<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#14676a">生活者デジタルツイン・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">購入意向率を需要予測へ変える</text><text x="70" y="196" font-size="32" fill="#334155">発売前の予測を将来の実売で検証する</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#14676a" font-size="46" font-weight="700">予測対象を固定</text><text x="92" y="344" fill="#334155" font-size="36">商品・価格・期限</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#14676a" font-size="46" font-weight="700">過去実売で校正</text><text x="642" y="344" fill="#334155" font-size="36">意向率を確率へ変換</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#14676a" font-size="46" font-weight="700">発売前に予測保存</text><text x="92" y="509" fill="#334155" font-size="36">条件と作成日を記録</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#14676a" font-size="46" font-weight="700">将来実売で検証</text><text x="642" y="509" fill="#334155" font-size="36">外れた商品も残す</text></g></svg>