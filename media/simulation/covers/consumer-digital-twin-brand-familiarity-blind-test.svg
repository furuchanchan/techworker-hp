<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#14676a">生活者デジタルツイン・ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">ブランド知識の混入を分ける試験</text><text x="70" y="196" font-size="32" fill="#334155">名称だけで変わる順位を市場選好と呼ばない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#14676a" font-size="46" font-weight="700">実名条件を記録</text><text x="92" y="344" fill="#334155" font-size="36">学習済み評判を含める</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#14676a" font-size="46" font-weight="700">属性だけで盲検</text><text x="642" y="344" fill="#334155" font-size="36">価格と機能を固定</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#14676a" font-size="46" font-weight="700">名称を候補間で入替</text><text x="92" y="509" fill="#334155" font-size="36">名前による反転を検知</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#14676a" font-size="46" font-weight="700">実在生活者で再検証</text><text x="642" y="509" fill="#334155" font-size="36">採否と販売量を分ける</text></g></svg>