<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#176b4c">AI研修・導入ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">90分のAI事故机上演習</text><text x="70" y="196" font-size="32" fill="#334155">既存計画の穴に責任者と期限を置く</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#176b4c" font-size="46" font-weight="700">事故の検知と対応宣言</text><text x="92" y="344" fill="#334155" font-size="36">連絡網と開始権限を確認</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#176b4c" font-size="46" font-weight="700">影響範囲と対象把握</text><text x="642" y="344" fill="#334155" font-size="36">顧客と業務の件数を数える</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#176b4c" font-size="46" font-weight="700">停止判断と対外説明</text><text x="92" y="509" fill="#334155" font-size="36">未確認情報を分けて示す</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#176b4c" font-size="46" font-weight="700">復旧条件と改善管理</text><text x="642" y="509" fill="#334155" font-size="36">責任者と期限を台帳へ残す</text></g></svg>