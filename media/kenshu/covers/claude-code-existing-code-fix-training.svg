<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#176b4c">AI研修・導入ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">既存コード改修の演習手順</text><text x="70" y="196" font-size="32" fill="#334155">計画・テスト・人の確認を省略しない</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#176b4c" font-size="46" font-weight="700">1. 不具合を再現</text><text x="92" y="344" fill="#334155" font-size="36">条件と失敗を確認</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#176b4c" font-size="46" font-weight="700">2. 計画を確認</text><text x="642" y="344" fill="#334155" font-size="36">変更範囲を絞る</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#176b4c" font-size="46" font-weight="700">3. 小さく修正</text><text x="92" y="509" fill="#334155" font-size="36">一原因ずつ直す</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#176b4c" font-size="46" font-weight="700">4. テストと確認</text><text x="642" y="509" fill="#334155" font-size="36">差分を人が読む</text></g></svg>