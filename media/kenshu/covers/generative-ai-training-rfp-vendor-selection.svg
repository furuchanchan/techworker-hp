<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#176b4c">AI研修・導入ラボ</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">研修委託を比べる4工程</text><text x="70" y="196" font-size="32" fill="#334155">会社名より納品物と受入条件を比べる</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="287" fill="#176b4c" font-size="42" font-weight="700">業務ギャップ固定</text><text x="92" y="342" fill="#334155" font-size="34">対象者と到達行動を決める</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="287" fill="#176b4c" font-size="42" font-weight="700">教材証拠を確認</text><text x="642" y="342" fill="#334155" font-size="34">根拠・版・更新条件を見る</text><rect x="70" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="457" fill="#176b4c" font-size="42" font-weight="700">模擬講義で比較</text><text x="92" y="512" fill="#334155" font-size="34">同じ課題を別々に採点する</text><rect x="620" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="457" fill="#176b4c" font-size="42" font-weight="700">更新・移管を契約</text><text x="642" y="512" fill="#334155" font-size="34">教材と履歴の引渡しを定める</text></g></svg>