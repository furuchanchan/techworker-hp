<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#176b4c">AI研修・導入ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">講師認定を更新する4記録</text><text x="70" y="196" font-size="32" fill="#334155">未回答と採点差を教材の版へ戻す</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#176b4c" font-size="46" font-weight="700">1. 未回答を記録</text><text x="92" y="344" fill="#334155" font-size="36">推測せず質問台帳へ残す</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#176b4c" font-size="46" font-weight="700">2. 確認先へ渡す</text><text x="642" y="344" fill="#334155" font-size="36">責任者と期限を決める</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#176b4c" font-size="46" font-weight="700">3. 採点差を照合</text><text x="92" y="509" fill="#334155" font-size="36">根拠場面と判定語を直す</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#176b4c" font-size="46" font-weight="700">4. 教材版へ反映</text><text x="642" y="509" fill="#334155" font-size="36">確定回答と基準を更新する</text></g></svg>