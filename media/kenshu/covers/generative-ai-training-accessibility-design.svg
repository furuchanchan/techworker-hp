<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#176b4c">AI研修・導入ラボ・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">生成AI研修の障壁を外す4地点</text><text x="70" y="196" font-size="32" fill="#334155">操作速度でなく業務判断を測る</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#176b4c" font-size="46" font-weight="700">申込時の条件確認</text><text x="92" y="344" fill="#334155" font-size="35">必要な支援と回答方法を聞く</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#176b4c" font-size="46" font-weight="700">教材への複数入口</text><text x="642" y="344" fill="#334155" font-size="35">字幕・文字・代替説明を用意</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#176b4c" font-size="46" font-weight="700">演習の操作障壁を除去</text><text x="92" y="509" fill="#334155" font-size="35">キーボードと時間延長に対応</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#176b4c" font-size="46" font-weight="700">評価対象を固定</text><text x="642" y="509" fill="#334155" font-size="36">根拠確認と判断を採点</text></g></svg>