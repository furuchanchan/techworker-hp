<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#785321">士業AIジャーナル</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">退職・担当変更の4確認</text><text x="70" y="196" font-size="32" fill="#334155">引継ぎと停止を別に完了する</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="287" fill="#785321" font-size="42" font-weight="700">保管先を把握</text><text x="92" y="342" fill="#334155" font-size="34">所有者と共有範囲</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="287" fill="#785321" font-size="42" font-weight="700">後任で確認</text><text x="642" y="342" fill="#334155" font-size="34">必要資料の閲覧・編集</text><rect x="70" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="457" fill="#785321" font-size="42" font-weight="700">前任の権限停止</text><text x="92" y="512" fill="#334155" font-size="34">対象案件・利用者を分離</text><rect x="620" y="405" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="457" fill="#785321" font-size="42" font-weight="700">保存と削除</text><text x="642" y="512" fill="#334155" font-size="34">必要記録と複製を区別</text></g></svg>