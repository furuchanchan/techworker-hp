<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#785321">士業AIジャーナル・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">AI-OCRを原本と照合する4段階</text><text x="70" y="196" font-size="32" fill="#334155">確認済みの値だけを案件台帳へ移す</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#785321" font-size="46" font-weight="700">1. 原本と版を固定</text><text x="92" y="344" fill="#334155" font-size="36">受領日時・頁・差替を記録</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#785321" font-size="46" font-weight="700">2. 画像品質を判定</text><text x="642" y="344" fill="#334155" font-size="36">ぼけ・欠けは再取得へ戻す</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#785321" font-size="43" font-weight="700">3. 重要項目を原本照合</text><text x="92" y="509" fill="#334155" font-size="36">値と画像上の位置を確認</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#785321" font-size="43" font-weight="700">4. 案件台帳へ確定登録</text><text x="642" y="509" fill="#334155" font-size="36">確認者・日付・訂正を残す</text></g></svg>