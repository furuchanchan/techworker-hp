<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#785321">士業AIジャーナル・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">期限候補を確定する手順</text><text x="70" y="196" font-size="32" fill="#334155">AIは候補抽出、人が原文で確定する</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#785321" font-size="46" font-weight="700">1. 文書を受領</text><text x="92" y="344" fill="#334155" font-size="36">対象情報を絞る</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#785321" font-size="46" font-weight="700">2. 候補を抽出</text><text x="642" y="344" fill="#334155" font-size="36">条件と根拠も出す</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#785321" font-size="46" font-weight="700">3. 原文を確認</text><text x="92" y="509" fill="#334155" font-size="36">責任者が確定</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#785321" font-size="46" font-weight="700">4. 正本から転記</text><text x="642" y="509" fill="#334155" font-size="36">例外を毎日確認</text></g></svg>