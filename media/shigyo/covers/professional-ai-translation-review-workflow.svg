<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif"><text x="70" y="76" font-size="26" fill="#785321">士業AIジャーナル・記事内整理</text><text x="70" y="139" font-size="48" font-weight="700" fill="#0f172a">AI翻訳の確認工程</text><text x="70" y="196" font-size="32" fill="#334155">自然さより原文との意味一致を先に見る</text><rect x="70" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="288" fill="#785321" font-size="46" font-weight="700">用途と正本を先に決定</text><text x="92" y="344" fill="#334155" font-size="36">優先する言語と版を決める</text><rect x="620" y="235" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="288" fill="#785321" font-size="46" font-weight="700">案件用語を事前に固定</text><text x="642" y="344" fill="#334155" font-size="36">定義語の表記揺れを防ぐ</text><rect x="70" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="92" y="453" fill="#785321" font-size="46" font-weight="700">原文と訳文の意味対照</text><text x="92" y="509" fill="#334155" font-size="36">主体と義務と例外を確認</text><rect x="620" y="400" width="510" height="135" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="642" y="453" fill="#785321" font-size="46" font-weight="700">修正理由と版を記録</text><text x="642" y="509" fill="#334155" font-size="36">確認者と変更履歴を残す</text></g></svg>